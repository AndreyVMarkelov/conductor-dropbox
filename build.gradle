plugins {
    id 'java-library'
    id 'application'
    id 'com.diffplug.spotless' version '7.2.1'
}

group = 'com.dropbox.conductor'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

configurations {
    mockitoAgent
}

application {
    mainClass = 'com.dropbox.conductor.WorkerApplication'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

spotless {
    java {
        palantirJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }

    groovyGradle {
        target '*.gradle'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.register('dropboxLogin', JavaExec) {
    group = 'application'
    description = 'Authorize Dropbox with PKCE and print refresh-token environment variables'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.dropbox.conductor.dropbox.DropboxPkceLogin'

    standardInput = System.in
}

tasks.named('check') {
    dependsOn 'spotlessCheck'
}

dependencies {
    implementation 'com.dropbox.core:dropbox-core-sdk:8.0.2'
    implementation 'org.conductoross:conductor-client:5.1.0'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.mockito:mockito-core:5.20.0'
    mockitoAgent('org.mockito:mockito-core:5.20.0') {
        transitive = false
    }
}

test {
    useJUnitPlatform()

    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"

    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}
