plugins {
    id 'java-library'
    id 'application'
    id 'com.diffplug.spotless' version '8.10.0'
    id 'checkstyle'
    id 'pl.allegro.tech.build.axion-release' version '1.21.3'
}

group = 'com.dropbox.conductor'
scmVersion {
    tag {
        prefix = 'v'
    }
    versionIncrementer 'incrementMinor'
}
version = scmVersion.version

repositories {
    mavenCentral()
}

configurations {
    mockitoAgent
}

application {
    mainClass = 'com.dropbox.conductor.WorkerApplication'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

checkstyle {
    toolVersion = '10.26.1'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

spotless {
    java {
        palantirJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }

    groovyGradle {
        target '*.gradle'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.register('dropboxLogin', JavaExec) {
    group = 'application'
    description = 'Authorize Dropbox with PKCE and print refresh-token environment variables'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.dropbox.conductor.dropbox.DropboxPkceLogin'

    standardInput = System.in
}

tasks.named('release') {
    dependsOn 'check'
}

tasks.named('check') {
    dependsOn 'spotlessCheck', 'checkstyleMain', 'checkstyleTest'
}

dependencies {
    implementation 'com.dropbox.core:dropbox-core-sdk:8.0.2'
    implementation 'org.conductoross:conductor-client:5.1.0'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.mockito:mockito-core:5.23.0'
    mockitoAgent('org.mockito:mockito-core:5.23.0') {
        transitive = false
    }
}

test {
    useJUnitPlatform()

    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"

    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}
